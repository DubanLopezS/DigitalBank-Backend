# Configuracion exclusiva de pruebas.
# Al estar en src/test/resources tiene precedencia sobre src/main/resources,
# por lo que debe ser autocontenida.
spring.application.name=reportes-api

# Base de datos en memoria: las pruebas no dependen de un PostgreSQL real
spring.datasource.url=jdbc:h2:mem:reportes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Secreto ficticio: HMAC-SHA256 exige al menos 256 bits (32 caracteres)
security.jwt.secret=secreto-de-pruebas-reportes-api-0123456789