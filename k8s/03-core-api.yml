# core-api: dueña del esquema (Flyway). Arranca con 2 réplicas; Flyway usa un bloqueo en la base, así que dos pods no migran a la vez.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: digitalbank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-api
  template:
    metadata:
      labels:
        app: core-api
    spec:
      containers:
        - name: core-api
          image: digitalbank/core-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - secretRef:
                name: digitalbank-secretos
            - configMapRef:
                name: digitalbank-config
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          # Spring tarda en arrancar: hasta 5 minutos antes de darlo por fallido.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
---
# NodePort: la API queda en http://localhost:30082 y el Service reparte las
# peticiones entre todas las réplicas (pods) del Deployment.
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: digitalbank
spec:
  type: NodePort
  selector:
    app: core-api
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
