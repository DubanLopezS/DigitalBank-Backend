# auth-api: login y clientes. Si arranca antes de que core-api termine las migraciones, Kubernetes la reinicia hasta que las tablas existan.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: digitalbank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
        - name: auth-api
          image: digitalbank/auth-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: digitalbank-secretos
            - configMapRef:
                name: digitalbank-config
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          # Spring tarda en arrancar: hasta 5 minutos antes de darlo por fallido.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
---
# NodePort: la API queda en http://localhost:30081 y el Service reparte las
# peticiones entre todas las réplicas (pods) del Deployment.
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: digitalbank
spec:
  type: NodePort
  selector:
    app: auth-api
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
