spring.application.name=core-api

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# core-api es el dueño del esquema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=${PORT:8082}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=60

logging.pattern.level=%5p [traceId=%X{traceId:-}]

# Rutas sin token, ademas de /error y Swagger (ver SecurityConfig en common)
seguridad.rutas-publicas=/actuator/health,/actuator/health/**,/actuator/prometheus

# Observabilidad (Actuator + Micrometer). En Render solo se expone health;
# docker-compose y Kubernetes agregan prometheus con METRICS_EXPOSURE.
management.endpoints.web.exposure.include=${METRICS_EXPOSURE:health}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
