spring.datasource.url=jdbc:h2:mem:digitalbank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Las migraciones usan gen_random_uuid() (solo Postgres); en test Hibernate crea el esquema.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

security.jwt.secret=clave-de-prueba-solo-para-tests-con-mas-de-32-bytes
